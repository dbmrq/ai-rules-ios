# XcodeGen: optional Periphery target.
# Note: some XcodeGen versions do not support `type: aggregate`. Prefer
# `./scripts/deadcode.sh` and Xcode Cloud `ci_post_xcodebuild.sh` instead.
#
# If your XcodeGen supports aggregates:
#
# AppQuality:
#   type: aggregate
#   platform: iOS
#   settings:
#     base:
#       ENABLE_USER_SCRIPT_SANDBOXING: NO
#   postbuildScripts:
#     - name: Periphery
#       basedOnDependencyAnalysis: false
#       script: |
#         set -euo pipefail
#         cd "${SRCROOT}"
#         ./scripts/deadcode.sh --format xcode
