# Shared SwiftLint config for Leio iOS apps.
# Apps should set parent_config to this file and only override paths / exclusions.

opt_in_rules:
  - cyclomatic_complexity
  - empty_count
  - force_unwrapping
  - redundant_nil_coalescing
  - contains_over_filter_count
  - prefer_self_in_static_references

disabled_rules:
  - trailing_whitespace
  - todo

force_unwrapping:
  severity: error

force_cast:
  severity: error

force_try:
  severity: warning

cyclomatic_complexity:
  warning: 12
  error: 20
  ignores_case_statements: true

file_length:
  warning: 400
  error: 800
  ignore_comment_only_lines: true

type_body_length:
  warning: 250
  error: 400

function_body_length:
  warning: 50
  error: 80
  ignores_comments: true

function_parameter_count:
  warning: 6
  error: 8

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 3

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - to
    - on
    - at

custom_rules:
  no_observable_object:
    name: "Prefer @Observable over ObservableObject"
    regex: "ObservableObject|@Published\\b"
    message: "Use @Observable / @State instead of ObservableObject / @Published."
    severity: warning

reporter: xcode
