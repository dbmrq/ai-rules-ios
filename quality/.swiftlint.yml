# Shared SwiftLint config for Leio iOS apps.
# Apps set parent_config to this file and only override paths / exclusions.
#
# Philosophy: fail the build on agent foot-guns; keep length/style as warnings
# so existing apps can adopt the plug-in without a massive rewrite.

only_rules:
  - force_cast
  - force_try
  - cyclomatic_complexity
  - file_length
  - type_body_length
  - function_body_length
  - function_parameter_count
  - nesting
  - empty_count
  - redundant_nil_coalescing
  - contains_over_filter_count
  - no_observable_object

force_cast:
  severity: error

force_try:
  severity: warning

empty_count:
  severity: warning

cyclomatic_complexity:
  warning: 15
  error: 25
  ignores_case_statements: true

file_length:
  warning: 700
  error: 1200
  ignore_comment_only_lines: true

type_body_length:
  warning: 650
  error: 800

function_body_length:
  warning: 90
  error: 120
  ignores_comments: true

function_parameter_count:
  warning: 7
  error: 10

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 4

custom_rules:
  no_observable_object:
    name: "Prefer @Observable over ObservableObject"
    regex: "\\bObservableObject\\b|@Published\\b"
    message: "Use @Observable / @State instead of ObservableObject / @Published."
    severity: warning

reporter: xcode
