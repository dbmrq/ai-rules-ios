name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
          config: '.markdownlint.json'

      - name: Check shell scripts
        run: |
          shellcheck install.sh uninstall.sh sync.sh
          shellcheck quality/scripts/*.sh
          shellcheck quality/ci/*.sh

      - name: Test script syntax
        run: |
          bash -n install.sh uninstall.sh sync.sh
          bash -n quality/scripts/*.sh
          bash -n quality/ci/*.sh

